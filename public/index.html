<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>인스타그램 인플루언서 분석</title>
    <style>
      :root {
        font-family:
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          sans-serif;
        color: #121212;
        background: #fafafa;
      }
      body {
        margin: 0;
        padding: 24px 16px 48px;
        max-width: 960px;
        margin-inline: auto;
      }
      h1 {
        font-size: 1.35rem;
        font-weight: 650;
        margin: 0 0 8px;
      }
      p.lead {
        margin: 0 0 20px;
        color: #555;
        line-height: 1.5;
      }
      label {
        display: block;
        font-weight: 600;
        margin-bottom: 8px;
        font-size: 0.95rem;
      }
      textarea {
        width: 100%;
        min-height: 140px;
        padding: 12px 14px;
        border-radius: 10px;
        border: 1px solid #dbdbdb;
        font-size: 0.95rem;
        box-sizing: border-box;
        resize: vertical;
      }
      button {
        margin-top: 12px;
        padding: 10px 18px;
        border: none;
        border-radius: 8px;
        background: linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045);
        color: #fff;
        font-weight: 650;
        cursor: pointer;
        font-size: 0.95rem;
      }
      button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }
      .note {
        margin-top: 10px;
        font-size: 0.82rem;
        color: #777;
      }
      .error {
        margin-top: 14px;
        padding: 12px 14px;
        border-radius: 8px;
        background: #ffe8e8;
        color: #8a1f1f;
        white-space: pre-wrap;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 24px;
        font-size: 0.88rem;
        background: #fff;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 1px 4px rgb(0 0 0 / 6%);
      }
      th,
      td {
        border-bottom: 1px solid #eee;
        padding: 10px 10px;
        text-align: left;
        vertical-align: top;
      }
      th {
        background: #f3f3f3;
        font-weight: 650;
      }
      tr:last-child td {
        border-bottom: none;
      }
      .muted {
        color: #888;
      }
      .posts-cell ol {
        margin: 6px 0 0;
        padding-left: 18px;
      }
      .posts-cell li {
        margin-bottom: 6px;
      }
      code {
        font-size: 0.85em;
        background: #f0f0f0;
        padding: 2px 6px;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <h1>인스타그램 인플루언서 분석을 해봅시다</h1>
    <p class="lead">
      아래에 인플루언서 사용자명을 입력하면 각 계정의
      <strong>팔로워 수</strong>와 <strong>최근 게시물 10개</strong>의
      좋아요·댓글 수를 수집합니다.
    </p>

    <label for="handles">인플루언서 아이디 (줄바꿈 또는 쉼표로 구분)</label>
    <textarea
      id="handles"
      placeholder="예:&#10;nasa&#10;instagram&#10;natgeo"
      spellcheck="false"
    ></textarea>
    <button type="button" id="run">분석 시작</button>
    <p class="note">
      Instagram UI·정책 변경 시 일부 값이 비어 나올 수 있습니다. 자동화는
      이용약관 및 관련 법규를 준수해야 합니다.
    </p>

    <div id="msg"></div>
    <div id="out"></div>

    <script>
      const btn = document.getElementById("run");
      const handlesEl = document.getElementById("handles");
      const msg = document.getElementById("msg");
      const out = document.getElementById("out");

      function fmt(n) {
        if (n == null || Number.isNaN(n)) return "—";
        return n.toLocaleString("ko-KR");
      }

      function avg(values) {
        const nums = values.filter(
          (v) => typeof v === "number" && !Number.isNaN(v),
        );
        if (nums.length === 0) return null;
        return nums.reduce((sum, v) => sum + v, 0) / nums.length;
      }

      function calcErPercent(row) {
        if (!row.followers || row.followers <= 0) return null;
        const posts = row.posts || [];
        const avgLikes = avg(posts.map((p) => p.likes));
        const avgComments = avg(posts.map((p) => p.comments));
        if (avgLikes == null || avgComments == null) return null;
        return ((avgLikes + avgComments) / row.followers) * 100;
      }

      function erGrade(erPercent) {
        if (erPercent == null) return null;
        if (erPercent >= 5) return "Nano";
        if (erPercent >= 3) return "Micro";
        if (erPercent >= 2) return "Macro";
        if (erPercent >= 1) return "Mega";
        return "1% 미만";
      }

      function fmtPercent(n) {
        if (n == null || Number.isNaN(n)) return "—";
        return `${n.toFixed(2)}%`;
      }

      btn.addEventListener("click", async () => {
        msg.innerHTML = "";
        out.innerHTML = "";
        const usernames = handlesEl.value;
        btn.disabled = true;
        btn.textContent = "분석 중… (시간이 걸릴 수 있습니다)";
        try {
          const res = await fetch("/api/analyze", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ usernames }),
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) {
            msg.innerHTML =
              '<div class="error">' +
              (data.error || "요청 처리 중 오류가 발생했습니다.") +
              "</div>";
            return;
          }

          const rows = data.results || [];
          let html =
            "<table><thead><tr><th>계정</th><th>팔로워</th><th>최근 게시물 (최대 10개)</th><th>비고</th></tr></thead><tbody>";

          for (const r of rows) {
            const erPercent = calcErPercent(r);
            const grade = erGrade(erPercent);
            const note = r.error
              ? `<span class="muted">${r.error}</span>`
              : erPercent == null
                ? '<span class="muted">ER 계산 불가</span>'
                : `ER ${fmtPercent(erPercent)}<br><strong>${grade}</strong>`;
            const posts =
              (r.posts || [])
                .map(
                  (p, i) =>
                    `<li>#${i + 1} 좋아요 ${fmt(p.likes)}, 댓글 ${fmt(p.comments)} <span class="muted"><a href="${p.url}" target="_blank" rel="noopener">링크</a></span></li>`,
                )
                .join("") ||
              '<span class="muted">게시물 링크를 찾지 못했습니다.</span>';

            html += `<tr>
              <td><a href="${r.profileUrl}" target="_blank" rel="noopener">@${r.username}</a></td>
              <td>${fmt(r.followers)}</td>
              <td class="posts-cell"><ol>${posts}</ol></td>
              <td>${note}</td>
            </tr>`;
          }

          html += "</tbody></table>";
          out.innerHTML = html;
        } catch (e) {
          msg.innerHTML =
            '<div class="error">' +
            (e && e.message ? e.message : String(e)) +
            "</div>";
        } finally {
          btn.disabled = false;
          btn.textContent = "분석 시작";
        }
      });
    </script>
  </body>
</html>
