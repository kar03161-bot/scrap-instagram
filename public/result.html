<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>인스타그램 인플루언서 분석 결과</title>
    <link rel="stylesheet" href="/css/style.css" />
    <style>
      :root {
        --off-white: #f7f5f0;
        --cream: #ede9e0;
        --blue-deep: #1a3a5c;
        --blue-mid: #2b5ba8;
        --blue-light: #4a80d4;
        --blue-pale: #d6e4f7;
        --blue-ghost: #ebf2fc;
        --ink: #1c1c1c;
        --muted: #7a7a72;
        --border: #d8d4cb;
        --grade-s: #2b72b8;
        --grade-a: #54b77b;
        --grade-b: #d9b62e;
        --grade-c: #c97642;
        --grade-d: #bd5555;
        font-family:
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          sans-serif;
        color: var(--ink);
        background: var(--off-white);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          linear-gradient(var(--cream) 1px, transparent 1px),
          linear-gradient(90deg, var(--cream) 1px, transparent 1px),
          var(--off-white);
        background-size: 28px 28px;
      }

      .result-shell {
        width: min(1180px, calc(100% - 32px));
        margin-inline: auto;
        padding: 44px 0 56px;
      }

      .result-header {
        margin-bottom: 34px;
      }

      h1 {
        margin: 0;
        color: var(--blue-deep);
        font-size: clamp(2.3rem, 5vw, 4rem);
        font-weight: 750;
        line-height: 1.05;
        letter-spacing: -0.04em;
      }

      .lead {
        max-width: 620px;
        margin: 18px 0 0;
        color: var(--muted);
        font-size: clamp(1rem, 2vw, 1.2rem);
        line-height: 1.55;
      }

      .result-card {
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: 22px;
        background: color-mix(in srgb, var(--off-white) 94%, white);
        box-shadow: 0 22px 56px color-mix(in srgb, var(--blue-deep) 14%, transparent);
      }

      .table-wrap {
        overflow-x: auto;
      }

      table {
        width: 100%;
        min-width: 980px;
        border-collapse: collapse;
        font-size: 0.95rem;
      }

      thead {
        background: color-mix(in srgb, var(--cream) 72%, white);
      }

      th,
      td {
        padding: 18px 22px;
        border-bottom: 1px solid var(--border);
        text-align: center;
        vertical-align: middle;
      }

      th {
        color: var(--muted);
        font-size: 0.82rem;
        font-weight: 750;
        letter-spacing: 0.02em;
      }

      tbody tr:last-child td {
        border-bottom: none;
      }

      tbody tr {
        transition: background 0.18s;
      }

      tbody tr:hover {
        background: var(--blue-ghost);
      }

      .rank-cell {
        width: 58px;
        color: var(--blue-mid);
        font-family: Georgia, "Times New Roman", serif;
        font-size: 1.05rem;
        font-weight: 700;
      }

      .account-cell {
        text-align: left;
        font-weight: 750;
      }

      .account-name {
        color: var(--ink);
        text-decoration: none;
      }

      .metric-main {
        color: var(--ink);
        font-weight: 750;
      }

      .metric-sub {
        margin-top: 4px;
        color: var(--muted);
        font-size: 0.8rem;
      }

      .er-cell {
        color: #743c46;
        font-weight: 800;
      }

      .date-cell {
        color: var(--muted);
        font-size: 0.88rem;
        white-space: nowrap;
      }

      .grade-badge {
        width: 42px;
        height: 42px;
        margin-inline: auto;
        border: 2px solid currentColor;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: color-mix(in srgb, currentColor 7%, transparent);
        font-family: Georgia, "Times New Roman", serif;
        font-size: 1.15rem;
        font-weight: 800;
      }

      .grade-s {
        color: var(--grade-s);
      }

      .grade-a {
        color: var(--grade-a);
      }

      .grade-b {
        color: var(--grade-b);
      }

      .grade-c {
        color: var(--grade-c);
      }

      .grade-d {
        color: var(--grade-d);
      }

      .empty-state {
        padding: 52px 28px;
        text-align: center;
      }

      .empty-state p {
        margin: 0 0 22px;
        color: var(--muted);
      }

      .btn-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0 18px;
        border-radius: 12px;
        background: var(--blue-mid);
        color: var(--off-white);
        font-weight: 750;
        text-decoration: none;
      }

      .legend {
        margin-top: 28px;
        padding: 24px 28px;
        border: 1px solid var(--border);
        border-radius: 18px;
        background: color-mix(in srgb, var(--off-white) 94%, white);
      }

      .legend-title {
        margin: 0 0 16px;
        color: var(--blue-deep);
        font-weight: 750;
      }

      .legend-list {
        display: flex;
        flex-wrap: wrap;
        gap: 18px 28px;
      }

      .legend-item {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        color: var(--muted);
        font-size: 0.95rem;
        white-space: nowrap;
      }

      .legend-item .grade-badge {
        width: 38px;
        height: 38px;
        margin: 0;
        flex: 0 0 auto;
        font-size: 1rem;
      }

      @media (max-width: 720px) {
        .result-shell {
          padding-top: 28px;
        }

        th,
        td {
          padding: 16px 18px;
        }

        .legend {
          padding: 22px 18px;
        }

        .legend-list {
          display: grid;
          gap: 14px;
        }
      }
    </style>
  </head>
  <body>
    <main class="result-shell">
      <header class="result-header">
        <p class="hero-tag"><span aria-hidden="true"></span>Instagram Analytics</p>
        <h1>계정 분석<br />결과</h1>
        <p class="lead">Vercel DB에 저장된 인플루언서 분석 목록입니다</p>
      </header>

      <section class="result-card" aria-label="인스타그램 분석 결과">
        <div id="result-content"></div>
      </section>

      <section class="legend" aria-label="등급 기준">
        <p class="legend-title">등급 기준 (ER 기반)</p>
        <div class="legend-list">
          <div class="legend-item">
            <span class="grade-badge grade-s">S</span>
            <span>5% 이상 - 슈퍼 인플루언서</span>
          </div>
          <div class="legend-item">
            <span class="grade-badge grade-a">A</span>
            <span>3-5% - 높은 참여도</span>
          </div>
          <div class="legend-item">
            <span class="grade-badge grade-b">B</span>
            <span>1-3% - 평균 참여도</span>
          </div>
          <div class="legend-item">
            <span class="grade-badge grade-c">C</span>
            <span>0.5-1% - 낮은 참여도</span>
          </div>
          <div class="legend-item">
            <span class="grade-badge grade-d">D</span>
            <span>0.5% 미만 - 매우 낮음</span>
          </div>
        </div>
      </section>
    </main>

    <script>
      const resultContent = document.getElementById("result-content");

      function avg(values) {
        const nums = values.filter((v) => typeof v === "number" && !Number.isNaN(v));
        if (nums.length === 0) return null;
        return nums.reduce((sum, v) => sum + v, 0) / nums.length;
      }

      function calcErPercent(row) {
        if (!row.followers || row.followers <= 0) return null;
        const posts = row.posts || [];
        const avgLikes = avg(posts.map((p) => p.likes));
        const avgComments = avg(posts.map((p) => p.comments));
        if (avgLikes == null || avgComments == null) return null;
        return ((avgLikes + avgComments) / row.followers) * 100;
      }

      function gradeFor(erPercent) {
        if (erPercent == null) return { label: "-", className: "grade-d" };
        if (erPercent >= 5) return { label: "S", className: "grade-s" };
        if (erPercent >= 3) return { label: "A", className: "grade-a" };
        if (erPercent >= 1) return { label: "B", className: "grade-b" };
        if (erPercent >= 0.5) return { label: "C", className: "grade-c" };
        return { label: "D", className: "grade-d" };
      }

      function gradeBadge(row) {
        const label = String(row.grade || "").toUpperCase();
        if (["S", "A", "B", "C", "D"].includes(label)) {
          return { label, className: `grade-${label.toLowerCase()}` };
        }
        return gradeFor(row.er);
      }

      function fmt(n) {
        if (n == null || Number.isNaN(n)) return "-";
        return Math.round(n).toLocaleString("ko-KR");
      }

      function compact(n) {
        if (n == null || Number.isNaN(n)) return "-";
        if (Math.abs(n) >= 1_000_000) return `${(n / 1_000_000).toFixed(1)}M`;
        if (Math.abs(n) >= 1_000) return `${(n / 1_000).toFixed(1)}K`;
        return Math.round(n).toLocaleString("ko-KR");
      }

      function fmtPercent(n) {
        if (n == null || Number.isNaN(n)) return "-";
        return `${n.toFixed(2)}%`;
      }

      function fmtDate(value) {
        if (!value) return "-";
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return "-";
        return date.toLocaleString("ko-KR", {
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
        });
      }

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function renderEmpty() {
        resultContent.innerHTML = `
          <div class="empty-state">
            <p>DB에 저장된 분석 결과가 없습니다. 계정 분석을 먼저 진행해 주세요.</p>
            <a class="btn-link" href="/">분석 페이지로 돌아가기</a>
          </div>
        `;
      }

      function renderError(message) {
        resultContent.innerHTML = `
          <div class="empty-state">
            <p>${escapeHtml(message || "분석 목록을 불러오는 중 오류가 발생했습니다.")}</p>
            <a class="btn-link" href="/">분석 페이지로 돌아가기</a>
          </div>
        `;
      }

      function renderResults(rows) {
        const body = rows
          .map((row, index) => {
            const erPercent = row.er;
            const grade = gradeBadge(row);
            const username = escapeHtml(row.username || "-");

            return `
              <tr>
                <td class="rank-cell">${index + 1}</td>
                <td class="account-cell">
                  <span class="account-name">${username}</span>
                </td>
                <td>
                  <div class="metric-main">${compact(row.followers)}</div>
                  <div class="metric-sub">${fmt(row.followers)}</div>
                </td>
                <td>
                  <div class="metric-main">${compact(row.likes)}</div>
                  <div class="metric-sub">${fmt(row.likes)}</div>
                </td>
                <td>
                  <div class="metric-main">${compact(row.comments)}</div>
                  <div class="metric-sub">${fmt(row.comments)}</div>
                </td>
                <td class="er-cell">${fmtPercent(erPercent)}</td>
                <td>
                  <span class="grade-badge ${grade.className}">${grade.label}</span>
                </td>
                <td class="date-cell">${fmtDate(row.analyzedAt)}</td>
              </tr>
            `;
          })
          .join("");

        resultContent.innerHTML = `
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>#</th>
                  <th>계정</th>
                  <th>팔로워</th>
                  <th>평균 좋아요</th>
                  <th>평균 댓글</th>
                  <th>ER</th>
                  <th>등급</th>
                  <th>조회한 날짜</th>
                </tr>
              </thead>
              <tbody>${body}</tbody>
            </table>
          </div>
        `;
      }

      async function loadResults() {
        const res = await fetch("/api/influencers");
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          renderError(data.error);
          return;
        }

        const rows = Array.isArray(data.results) ? data.results : [];
        if (rows.length === 0) {
          renderEmpty();
        } else {
          renderResults(rows);
        }
      }

      loadResults().catch((error) => {
        renderError(error && error.message ? error.message : String(error));
      });
    </script>
  </body>
</html>
